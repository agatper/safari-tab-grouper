<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Grouper</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, sans-serif;
      }
      #tab-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .tab-card {
        flex: 0 0 auto;
        width: 100px;
        padding: 8px;
        border-radius: 8px;
        background: #f0f0f0;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="tab-list"></div>
    <script src="popup.js"></script>
  </body>
</html>
